# Produzione del nuovo stack (NestJS + React + Postgres). NON ancora in uso:
# il deploy attuale resta docker-compose.yml (PHP). Da attivare su Dokploy
# solo dopo l'approvazione finale e la migrazione dei dati.
#
# Variabili obbligatorie (Dokploy > Environment): DB_PASSWORD, JWT_SECRET,
# JWT_REFRESH_SECRET, APP_ENCRYPTION_KEY (almeno 16 caratteri, casuali),
# APP_URL, SMTP_*, REALTIME_SECRET, SUPERADMIN_*, CRM_COMPANY_SLUG.
# Il dominio punta al servizio "frontend" (porta 80): nginx inoltra al backend.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-cora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD obbligatoria}
      POSTGRES_DB: ${DB_DATABASE:-cora}
      TZ: Europe/Rome
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cora} -d ${DB_DATABASE:-cora}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/node/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-cora}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE:-cora}
      DB_RLS: "on"
      RUN_MIGRATIONS: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obbligatoria}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET obbligatoria}
      JWT_EXPIRY: ${JWT_EXPIRY:-3600}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY obbligatoria}
      APP_URL: ${APP_URL:?APP_URL obbligatoria}
      FRONTEND_URL: ${APP_URL}
      CRM_COMPANY_SLUG: ${CRM_COMPANY_SLUG:-connecteed}
      SMTP_ENABLED: ${SMTP_ENABLED:-1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-tls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ConnecteedHR}
      REALTIME_SECRET: ${REALTIME_SECRET:-}
      REALTIME_URL: http://realtime:3001
      SUPERADMIN_USER: ${SUPERADMIN_USER:-}
      SUPERADMIN_PASS_HASH: ${SUPERADMIN_PASS_HASH:-}
      SUPERADMIN_TOTP_SECRET: ${SUPERADMIN_TOTP_SECRET:-}
      CONNECTEED_APP_ID: ${CONNECTEED_APP_ID:-}
      CONNECTEED_APP_SECRET: ${CONNECTEED_APP_SECRET:-}
      CONNECTEED_WIDGET_ORIGIN: ${CONNECTEED_WIDGET_ORIGIN:-}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      # Vista Cora dell'HR (Figma "Modulo Cora · HR"): 1 = attiva, vuoto = interfaccia classica
      HR_CORA_UI: ${HR_CORA_UI:-}
      # Vista Cora del consulente del lavoro (Figma sezione 3): 1 = attiva, vuoto = interfaccia classica
      CONSULENTE_CORA_UI: ${CONSULENTE_CORA_UI:-}
      # Credenziali del vecchio MySQL: solo per leggere i token Wrike cifrati dal PHP.
      LEGACY_DB_PASSWORD: ${LEGACY_DB_PASSWORD:-}
      LEGACY_DB_NAME: ${LEGACY_DB_NAME:-}
      # Percorsi assoluti dei file salvati dal PHP nel database.
      STORAGE_LEGACY_DIR: /var/www/html/storage
      TZ: Europe/Rome
    volumes:
      - storage:/data/storage
      - uploads:/data/uploads

  realtime:
    build:
      context: ./realtime
    restart: unless-stopped
    environment:
      REALTIME_SECRET: ${REALTIME_SECRET:-}

  frontend:
    build:
      context: .
      dockerfile: docker/node/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      CRM_ORIGIN: ${CONNECTEED_WIDGET_ORIGIN:-https://fase.adichub.com}

volumes:
  pgdata:
  storage:
  uploads:
