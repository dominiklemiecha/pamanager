# Produzione del nuovo stack (NestJS + React + Postgres). NON ancora in uso:
# il deploy attuale resta docker-compose.yml (PHP). Da attivare su Dokploy
# solo dopo l'approvazione finale e la migrazione dei dati.
#
# Variabili obbligatorie (Dokploy > Environment): DB_PASSWORD, JWT_SECRET,
# JWT_REFRESH_SECRET, APP_ENCRYPTION_KEY (almeno 16 caratteri, casuali),
# APP_URL, SMTP_*, REALTIME_SECRET, SUPERADMIN_*, CRM_COMPANY_SLUG.
# Il dominio punta al servizio "frontend" (porta 80): nginx inoltra al backend.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-cora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD obbligatoria}
      POSTGRES_DB: ${DB_DATABASE:-cora}
      TZ: Europe/Rome
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cora} -d ${DB_DATABASE:-cora}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/node/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-cora}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE:-cora}
      DB_RLS: "on"
      RUN_MIGRATIONS: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obbligatoria}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET obbligatoria}
      JWT_EXPIRY: ${JWT_EXPIRY:-3600}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY obbligatoria}
      APP_URL: ${APP_URL:?APP_URL obbligatoria}
      FRONTEND_URL: ${APP_URL}
      CRM_COMPANY_SLUG: ${CRM_COMPANY_SLUG:-connecteed}
      SMTP_ENABLED: ${SMTP_ENABLED:-1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-tls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ConnecteedHR}
      REALTIME_SECRET: ${REALTIME_SECRET:-}
      REALTIME_URL: http://realtime:3001
      SUPERADMIN_USER: ${SUPERADMIN_USER:-}
      SUPERADMIN_PASS_HASH: ${SUPERADMIN_PASS_HASH:-}
      SUPERADMIN_TOTP_SECRET: ${SUPERADMIN_TOTP_SECRET:-}
      CONNECTEED_APP_ID: ${CONNECTEED_APP_ID:-}
      CONNECTEED_APP_SECRET: ${CONNECTEED_APP_SECRET:-}
      CONNECTEED_WIDGET_ORIGIN: ${CONNECTEED_WIDGET_ORIGIN:-}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      # Vista Cora dell'HR (Figma "Modulo Cora · HR"): 1 = attiva, vuoto = interfaccia classica
      HR_CORA_UI: ${HR_CORA_UI:-}
      # Vista Cora del consulente del lavoro (Figma sezione 3): 1 = attiva, vuoto = interfaccia classica
      CONSULENTE_CORA_UI: ${CONSULENTE_CORA_UI:-}
      # Credenziali del vecchio MySQL: solo per leggere i token Wrike cifrati dal PHP.
      LEGACY_DB_PASSWORD: ${LEGACY_DB_PASSWORD:-}
      LEGACY_DB_NAME: ${LEGACY_DB_NAME:-}
      # Percorsi assoluti dei file salvati dal PHP nel database.
      STORAGE_LEGACY_DIR: /var/www/html/storage
      TZ: Europe/Rome
    volumes:
      - storage:/data/storage
      - uploads:/data/uploads
    # Nome unico: il frontend sta anche sulla rete di Dokploy, dove altri
    # progetti possono avere un servizio "backend".
    networks:
      default:
        aliases: [cora-backend]

  realtime:
    build:
      context: ./realtime
    restart: unless-stopped
    environment:
      REALTIME_SECRET: ${REALTIME_SECRET:-}
    networks:
      default:
        aliases: [cora-realtime]

  frontend:
    build:
      context: .
      dockerfile: docker/node/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      CRM_ORIGIN: ${CONNECTEED_WIDGET_ORIGIN:-https://fase.adichub.com}
      BACKEND_URL: http://cora-backend:3100
      REALTIME_URL: http://cora-realtime:3001

  # Copia una tantum dei dati dal PHP di produzione (hr.connecteed.com): database
  # MariaDB e file. Parte solo con MIGRA_DATI=si, dopo che il backend ha creato
  # lo schema; rifiuta un database gia' popolato. Legge il vecchio progetto
  # Dokploy (VECCHIO_PROGETTO) in sola lettura: rete e volumi esterni.
  # Dopo il passaggio togliere questo servizio e le voci "vecchio_*".
  migrazione:
    build:
      context: .
      dockerfile: docker/node/backend.Dockerfile
      target: build
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy
    working_dir: /app/backend
    command: ["sh", "scripts/migra-produzione.sh"]
    environment:
      MIGRA_DATI: ${MIGRA_DATI:-no}
      # Con MIGRA_DATI=recupero: righe cambiate sul PHP dopo questo istante (UTC).
      RECUPERA_DA: ${RECUPERA_DA:-2026-11-04 07:37:49}
      CONFERMA_PRODUZIONE: si
      SRC_HOST: db
      SRC_PORT: 3306
      SRC_USER: ${VECCHIO_DB_USER:-pamanager}
      SRC_PASS: ${LEGACY_DB_PASSWORD:-}
      SRC_DB: ${LEGACY_DB_NAME:-pamanager}
      DST_HOST: postgres
      DST_PORT: 5432
      DST_USER: ${DB_USERNAME:-cora}
      DST_PASS: ${DB_PASSWORD}
      DST_DB: ${DB_DATABASE:-cora}
      TZ: Europe/Rome
    volumes:
      - storage:/data/storage
      - uploads:/data/uploads
      - vecchio_storage:/vecchio/storage:ro
      - vecchio_uploads:/vecchio/uploads:ro
    networks:
      - default
      - vecchio

networks:
  vecchio:
    external: true
    name: ${VECCHIO_PROGETTO:-hrmanager-app-u1wiit}_pamanager

volumes:
  pgdata:
  storage:
  uploads:
  vecchio_storage:
    external: true
    name: ${VECCHIO_PROGETTO:-hrmanager-app-u1wiit}_storage
  vecchio_uploads:
    external: true
    name: ${VECCHIO_PROGETTO:-hrmanager-app-u1wiit}_uploads
